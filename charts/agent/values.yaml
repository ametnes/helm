agent:

  replicas: 1
  name: ametnes-cloud-agent
  labels:
    app.kubernetes.io/module: agent
    app.kubernetes.io/instance: ametnes-cloud-agent

  selectorLabels:
    app.kubernetes.io/module: agent
    app.kubernetes.io/instance: ametnes-cloud-agent

  image:
    repository: ametnes/cloud-agent
    pullPolicy: IfNotPresent
    tag: "0.5.1"

  # imagePullSecrets:
  #   - name: pull-secret

  extraEnvs: []
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  # DNS policy and configuration for the agent pod.
  # Set dnsPolicy to "None" with custom nameservers when the cluster DNS cannot resolve
  # external domains (common in private/air-gapped k3s environments).
  # dnsPolicy: "None"
  # dnsConfig:
  #   nameservers:
  #     - 8.8.8.8
  #     - 8.8.4.4
  #   options:
  #     - name: ndots
  #       value: "2"
  #   searches:
  #     - svc.cluster.local
  #     - cluster.local
  dnsPolicy: ""
  dnsConfig: {}
  tls:
    trust:
      enabled: false
      # PEM CAs to append to the system bundle (e.g. TLS interception roots). Chart creates a Secret when secret.create is true.
      additionalCAs: []
      # Example (single CA):
      # additionalCAs:
      #   - crt: |
      #       -----BEGIN CERTIFICATE-----
      #       <your-interception-or-root-ca>
      #       -----END CERTIFICATE-----
      # Example (multiple CAs):
      # additionalCAs:
      #   - crt: |
      #       -----BEGIN CERTIFICATE-----
      #       <corporate-root-ca>
      #       -----END CERTIFICATE-----
      #   - crt: |
      #       -----BEGIN CERTIFICATE-----
      #       <corporate-intermediate-ca>
      #       -----END CERTIFICATE-----
      # secret.create: true - build Secret from additionalCAs (default name <release>-tls-trust).
      # secret.create: false + name - use an existing Secret; all keys under that Secret are appended to the bundle.
      secret:
        create: true
        name: ""
      initImage: alpine:3.19
      targetBundlePath: /etc/ssl/certs/ca-certificates.crt
  # clientCertSecret: client-tls
  rbac:
    enabled: true

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ametnes-cloud-agent

  config:
    # A location is a essentially a single kubernetes cluster. You need to login into your Ametnes Cloud account
    # and create a location. Then use the location_id here
    location: location_id
    # Endpoint requires clientCertSecret and uses client authentication. clientCertSecret MUST be set
    # You'll need to log into to your Ametnes Cloud account to generate the client certs
    # resource_endpoint: https://api.resources.cloud.ametnes.com
    
    # Endpoint does not use client authentication. clientCertSecret MUST be left out
    resource_endpoint: https://cloud.ametnes.com
    # Defaults to the namespace the agent is installed in
    namespace: ametnes-system
    proxy:
      enabled: false
      http: ""
      https: ""
      no_proxy: "127.0.0.1,localhost,.svc,.cluster.local,10.96.0.1,kubernetes.default.svc"

    # Per-request socket timeouts (seconds) for control-plane calls.
    # Without these a control-plane redeploy or network partition can leave the
    # agent's poll loop blocked on a hung connection indefinitely. Set 0 to
    # disable (restore infinite wait).
    http:
      connect_timeout: 10
      read_timeout: 60

    # Volume backup target. The agent creates vanilla Kubernetes Jobs; no CRDs
    # are installed. Choose either a mounted repository (NFS/PVC/hostPath) or
    # an S3-compatible repository.
    backup:
      enabled: false
      timeout: 3600
      retention: 30
      # Seconds to wait after scaling a service down before restoring volumes.
      scale_wait: 10
      poll_interval: 5
      max_concurrent: 4
      target:
        # mount | s3
        type: mount
        # Restic repository password, shared by both targets: a Secret in each
        # service namespace. Required for s3; mount targets may use
        # mount.password_file instead (the file wins when both are set).
        # Secrets in the agent namespace labelled ametnes.io/distribute are
        # copied to service namespaces by the agent (see BACKUP.md).
        # password_secret:
        #   name: backup-restic-password
        #   key: RESTIC_PASSWORD
        mount:
          # claim_name must exist in the service namespace (pods cannot mount
          # a PVC from another namespace). For shared NFS, prefer host_path:
          # a mount available on every node at the same path.
          claim_name: ""
          host_path: ""
          mount_path: /repo
          # Mount-only alternative to password_secret: a path inside the
          # mounted repository (for example /repo/.restic-password).
          password_file: ""
          # Defaults to <mount_path>/ametnes when empty.
          repository: ""
        s3:
          endpoint: ""
          bucket: ""
          prefix: ""
          region: ""
          # Secret containing AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. Must
          # exist in each service namespace, or use workload identity with an
          # empty secret_name.
          secret_name: ""
          access_key_key: AWS_ACCESS_KEY_ID
          secret_key_key: AWS_SECRET_ACCESS_KEY

    memcache:
      hosts:
        - system-cache:11211
      # python-memcached writes protocol diagnostics (for example
      # "delete expected DELETED, got: NOT_FOUND") straight to stderr, bypassing
      # the Python logger. It follows LOG_LEVEL=DEBUG by default; uncomment to
      # override that for the memcache client only.
      # debug: false
      session:
        expiry: 86400
      mysql:
        resources:
          data_expiry: 1
          lock_expiry: 1
    
    persistence:
      writeOnceStorageClass:
      writeManyStorageClass:

    worker:
      interval: 5
      attempts: 12
      retry_base_seconds: 5
      retry_max_delay_seconds: 120
      retry_max_total_seconds: 1800
      failure_report_attempts: 6
      failure_report_max_total_seconds: 300
      http_retries: 3

    # Phased deployment throttling. Heavy resources (PVC, StatefulSet, or any
    # controller whose pod template references a PVC) are applied one at a time
    # and waited for individually, to avoid overwhelming the storage
    # provisioner (e.g. iSCSI-backed Longhorn).
    deploy:
      # Numeric multiplier applied to every timing value below. 2 doubles all
      # cooldowns/timeouts; 0.5 halves them; 1 (default) leaves them as-is.
      # May be fractional.
      timeout_factor: 1
      # Seconds between lightweight resources (ConfigMap, Secret, Service, …).
      phase_cooldown_seconds: 1
      # Seconds between controller resources (StatefulSet, Deployment, …).
      controller_cooldown_seconds: 10
      # Per-controller individual readiness wait (seconds).
      controller_timeout: 30
      # Collective readiness wait for a controller phase (seconds).
      phase_timeout: 600
      # Max concurrent heavy (PVC/StatefulSet) operations per cluster.
      max_concurrent_heavy: 2
      # Memcache TTL for a heavy-resource semaphore slot.
      heavy_slot_ttl: 600
      # Poll interval when waiting for a heavy-resource slot.
      heavy_slot_wait: 5
      # Seconds between slot-wait warnings/events.
      heavy_slot_warn_interval: 30

    # Per-kind load-balancer overrides (visibility, scope). Reported on worker poll
    # and stored by control as the location capabilities (allowed visibility) and
    # defaults (visibility/scope used when the caller does not choose).
    # resources:
    #   "network/loadbalancer:1.0":
    #     config:
    #       visibility: private
    #       scope: location

    # tolerations:
    #   - key: ametnes.io/role
    #     operator: Equal
    #     value: Resources
    #     effect: NoSchedule

    # persistence:
      # storageClass: ametnes-resources-efs
      # accessModes:
      #   - ReadWriteMany

    # affinity:
    #   - matchExpressions:
    #     - key: ametnes.io/role
    #       operator: In
    #       values:
    #       - Resources

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext: {}
  resources:
    limits:
     cpu: 500m
     memory: 512Mi
    requests:
     cpu: 100m
     memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}
  
  networkPolicy:
    enabled: false
    allowExternal: false
    # Allow egress to specific namespaces (empty list means no cross-namespace access)
    allowedNamespaces:
      - name: "default"
        ports:
          - protocol: TCP
            port: 443
    # Allow egress to specific pods in the same namespace (empty list means all pods in same namespace)
    allowedSameNamespacePods: []
    # Kubernetes API server configuration
    kubernetesAPI:
      enabled: true
      # IP address/CIDR of the Kubernetes API server
      serverIP: "10.96.0.1/32"
      # Ports to allow for K8s API server (default: 443)
      ports:
        - protocol: TCP
          port: 443
    # List of external IP addresses/CIDRs to allow egress to
    externalIPs:
      - "8.8.8.8/32"
      - "35.246.98.44/32"
    # Ports to allow for external IPs (default: all ports)
    externalPorts:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 80

memcached:
  fullnameOverride: system-cache
  image:
    repository: ametnes/memcached
    tag: 1.6.17-debian-11-r9
  metrics:
    image:
      repository: ametnes/memcached-exporter
      tag: 0.15.0-debian-12-r3

nfs-server-provisioner:
  enabled: false
  persistence:
    enabled: true
    size: 20Gi
  storageClass:
    name: sharedfs
